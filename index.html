<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon War — Rise of Power</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    height: 100vh;
}

/* LOADING */
#loadingScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 9999;
}
.spinner {
    width: 60px; height: 60px;
    border: 5px solid #333; border-top: 5px solid #ff6b00;
    border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.loading-text { margin-top: 20px; color: #ff6b00; font-size: 1.2em; font-weight: bold; }

/* AUTH */
.auth-container {
    display: flex; justify-content: center; align-items: center;
    height: 100vh; padding: 20px;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
}
.auth-card {
    background: rgba(30, 41, 59, 0.95);
    border: 2px solid #ff6b00;
    border-radius: 20px; padding: 40px;
    max-width: 500px; width: 100%;
    box-shadow: 0 20px 60px rgba(255, 107, 0, 0.4);
}
.auth-card h1 {
    text-align: center; font-size: 3em; margin-bottom: 10px;
    background: linear-gradient(135deg, #ff6b00, #ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.auth-card .subtitle { text-align: center; color: #94a3b8; letter-spacing: 4px; margin-bottom: 30px; }
.auth-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
.auth-tab {
    flex: 1; padding: 14px; background: #0f172a; border: 2px solid #334155;
    border-radius: 10px; color: #fff; cursor: pointer; font-weight: bold;
    text-align: center; transition: all 0.3s;
}
.auth-tab.active { background: #ff6b00; border-color: #ff6b00; }
.auth-form { display: none; }
.auth-form.active { display: block; }

input {
    width: 100%; padding: 14px; margin: 10px 0;
    border-radius: 10px; border: 2px solid #334155;
    background: #0f172a; color: #fff; font-size: 15px;
}
input:focus { outline: none; border-color: #ff6b00; }

button {
    width: 100%; padding: 14px; margin: 10px 0;
    border-radius: 10px; border: none; font-weight: bold;
    font-size: 15px; cursor: pointer; text-transform: uppercase;
    transition: all 0.3s;
}
button:hover { transform: translateY(-2px); filter: brightness(1.2); }

.btn-primary { background: linear-gradient(135deg, #ff6b00, #ff4500); color: #fff; }
.btn-success { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; }

/* GAME SCREEN */
#gameView {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1920&q=80') center/cover;
    overflow: hidden;
}
#gameView::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(10, 14, 39, 0.7) 0%, rgba(26, 31, 58, 0.5) 100%);
    z-index: 1;
}

.game-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px;
    z-index: 10;
}

.player-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px 15px;
    border-radius: 12px;
    border: 2px solid #3b82f6;
    backdrop-filter: blur(10px);
}
.player-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    border: 2px solid #ffd700;
}
.player-info h3 {
    font-size: 1.2em;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
}
.player-info .uid {
    font-size: 0.85em;
    color: #94a3b8;
}
.text-admin { color: #c4b5fd; text-shadow: 0 0 10px rgba(196, 181, 253, 0.6); }
.text-player { color: #fff; }
.badge-adm { background: #7c3aed; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; }
.badge-vip { background: #ffd700; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; }

.game-logo { text-align: center; flex: 1; }
.logo-dragon {
    font-size: 4em;
    filter: drop-shadow(0 0 20px rgba(255, 107, 0, 0.8));
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.logo-text {
    font-size: 3.5em;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b00, #ff4500, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    line-height: 1;
}
.logo-subtitle {
    font-size: 1.2em;
    color: #fff;
    letter-spacing: 8px;
    margin-top: 5px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.config-btn {
    width: auto;
    padding: 10px 20px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid #64748b;
    border-radius: 12px;
    color: #fff;
    font-size: 0.9em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    backdrop-filter: blur(10px);
}
.config-btn:hover { border-color: #ff6b00; }

.main-content {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    position: relative;
}

.left-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    z-index: 10;
}

.btn-play {
    width: 280px;
    padding: 25px;
    background: linear-gradient(135deg, #ff6b00, #ff4500);
    border: 3px solid #ffd700;
    border-radius: 15px;
    font-size: 2em;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 0 30px rgba(255, 107, 0, 0.6);
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 107, 0, 0.6); }
    50% { box-shadow: 0 0 50px rgba(255, 107, 0, 0.9); }
}
.btn-play:hover { transform: scale(1.05); }

.btn-save {
    width: 220px;
    padding: 18px;
    background: linear-gradient(135deg, #22c55e, #15803d);
    border: 2px solid #4ade80;
    border-radius: 12px;
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn-load {
    width: 220px;
    padding: 18px;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    border: 2px solid #22d3ee;
    border-radius: 12px;
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn-new {
    width: 220px;
    padding: 18px;
    background: linear-gradient(135deg, #64748b, #475569);
    border: 2px solid #94a3b8;
    border-radius: 12px;
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
}

.center-character {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
}
.character-silhouette {
    font-size: 200px;
    filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.8));
    animation: glow 2s ease-in-out infinite;
}
@keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.8)); }
    50% { filter: drop-shadow(0 0 60px rgba(59, 130, 246, 1)); }
}
.character-dw {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3em;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(59, 130, 246, 1);
}

.right-side { width: 280px; }

.resources-bar {
    position: absolute;
    top: 100px;
    right: 20px;
    display: flex;
    gap: 15px;
    z-index: 10;
}
.resource-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px 15px;
    border-radius: 10px;
    border: 1px solid #ffd700;
    backdrop-filter: blur(10px);
}
.resource-icon { font-size: 1.5em; }
.resource-value { font-size: 1.2em; font-weight: bold; color: #ffd700; }

.btn-admin {
    position: absolute;
    top: 180px;
    right: 20px;
    width: auto;
    padding: 10px 20px;
    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    border: 2px solid #a78bfa;
    border-radius: 10px;
    color: #fff;
    font-size: 0.9em;
    z-index: 10;
}

.btn-logout {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: auto;
    padding: 10px 20px;
    background: rgba(239, 68, 68, 0.8);
    border: 2px solid #ef4444;
    border-radius: 10px;
    color: #fff;
    font-size: 0.9em;
    z-index: 10;
}

/* CHAT SYSTEM */
.chat-toggle {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #1e40af);
    border: 3px solid #60a5fa;
    color: #fff;
    font-size: 1.8em;
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
    transition: all 0.3s;
}
.chat-toggle:hover { transform: scale(1.1); }
.chat-toggle .notification {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ef4444;
    color: #fff;
    font-size: 0.5em;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: bold;
}

.chat-panel {
    position: fixed;
    bottom: 90px;
    left: 20px;
    width: 380px;
    height: 500px;
    background: rgba(15, 23, 42, 0.95);
    border: 2px solid #3b82f6;
    border-radius: 16px;
    z-index: 100;
    display: none;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
}
.chat-panel.active { display: flex; }

.chat-header {
    padding: 15px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border-bottom: 2px solid #334155;
    border-radius: 14px 14px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.chat-header h3 { color: #60a5fa; font-size: 1.1em; }
.chat-tabs {
    display: flex;
    gap: 5px;
    padding: 10px 15px;
    background: #0f172a;
}
.chat-tab {
    flex: 1;
    padding: 8px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #94a3b8;
    cursor: pointer;
    font-size: 0.85em;
    font-weight: bold;
    text-align: center;
}
.chat-tab.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: #fff;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }

.message {
    background: rgba(30, 41, 59, 0.6);
    padding: 10px 12px;
    border-radius: 10px;
    border-left: 3px solid #3b82f6;
}
.message.own {
    border-left-color: #22c55e;
    background: rgba(34, 197, 94, 0.1);
}
.message.system {
    border-left-color: #fbbf24;
    background: rgba(251, 191, 36, 0.1);
    font-style: italic;
}
.message-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    flex-wrap: wrap;
}
.message-author {
    font-weight: bold;
    font-size: 0.9em;
}
.message-uid {
    font-size: 0.7em;
    color: #64748b;
}
.message-time {
    font-size: 0.7em;
    color: #64748b;
    margin-left: auto;
}
.message-text {
    font-size: 0.9em;
    color: #e2e8f0;
    word-wrap: break-word;
}

.chat-input-area {
    padding: 12px;
    background: #0f172a;
    border-top: 2px solid #334155;
    border-radius: 0 0 14px 14px;
    display: flex;
    gap: 8px;
}
.chat-input {
    flex: 1;
    padding: 10px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #fff;
    font-size: 0.9em;
    margin: 0;
}
.chat-input:focus { border-color: #3b82f6; outline: none; }
.chat-send {
    width: auto;
    padding: 10px 18px;
    background: #3b82f6;
    border-radius: 8px;
    margin: 0;
}

/* PLAYERS LIST (for private chat) */
.players-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}
.player-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: rgba(30, 41, 59, 0.6);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.player-item:hover { background: rgba(59, 130, 246, 0.2); }
.player-item-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.1em;
}
.player-item-info { flex: 1; }
.player-item-name { font-weight: bold; font-size: 0.9em; }
.player-item-uid { font-size: 0.7em; color: #64748b; }
.player-item-status {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #22c55e;
}
.player-item-status.offline { background: #64748b; }

.private-chat-header {
    padding: 10px 15px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    gap: 10px;
}
.private-chat-header button {
    width: auto;
    padding: 5px 10px;
    font-size: 0.8em;
    margin: 0;
    background: #64748b;
}

/* TOAST */
#toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.9);
    border: 2px solid #ff6b00;
    color: #fff;
    padding: 15px 30px;
    border-radius: 12px;
    display: none;
    z-index: 9999;
    font-weight: bold;
    box-shadow: 0 0 30px rgba(255, 107, 0, 0.6);
}

.hidden { display: none !important; }

@media (max-width: 768px) {
    .logo-text { font-size: 2em; }
    .logo-subtitle { font-size: 0.8em; letter-spacing: 4px; }
    .btn-play { width: 200px; font-size: 1.5em; padding: 15px; }
    .btn-save, .btn-load, .btn-new { width: 180px; font-size: 1em; }
    .character-silhouette { font-size: 120px; }
    .main-content { padding: 0 20px; }
    .chat-panel { width: calc(100% - 40px); left: 20px; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">Carregando Dragon War...</div>
</div>

<!-- AUTH VIEW -->
<div id="authView" class="hidden">
    <div class="auth-container">
        <div class="auth-card">
            <h1>DRAGON WAR</h1>
            <p class="subtitle">RISE OF POWER</p>
            
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">Entrar</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">Criar Conta</div>
            </div>

            <div id="loginForm" class="auth-form active">
                <input id="loginEmail" type="email" placeholder="E-mail">
                <input id="loginPass" type="password" placeholder="Senha">
                <button class="btn-primary" onclick="doLogin()">ENTRAR</button>
            </div>

            <div id="registerForm" class="auth-form">
                <input id="regNick" placeholder="Nome do Personagem">
                <input id="regEmail" type="email" placeholder="E-mail">
                <input id="regPass" type="password" placeholder="Senha (mín. 6 caracteres)">
                <button class="btn-success" onclick="doRegister()">CADASTRAR</button>
            </div>
        </div>
    </div>
</div>

<!-- GAME VIEW -->
<div id="gameView" class="hidden">
    <div class="game-content">
        
        <div class="top-bar">
            <div class="player-profile">
                <div class="player-avatar" id="playerAvatar">?</div>
                <div class="player-info">
                    <h3 id="playerNameDisplay">Carregando...</h3>
                    <div class="uid">UID: <span id="playerUid">---</span></div>
                </div>
            </div>

            <div class="game-logo">
                <div class="logo-dragon">🐉</div>
                <div class="logo-text">DRAGON WAR</div>
                <div class="logo-subtitle">RISE OF POWER</div>
            </div>

            <button class="config-btn" onclick="showToast('️ Configurações')">
                <span style="font-size: 1.5em;">️</span>
                <span>Config.</span>
            </button>
        </div>

        <div class="resources-bar">
            <div class="resource-item">
                <span class="resource-icon">💰</span>
                <span class="resource-value" id="resCoins">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">💎</span>
                <span class="resource-value" id="resGems">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">⭐</span>
                <span class="resource-value" id="resPoints">0</span>
            </div>
        </div>

        <button id="btnOpenAdmin" class="btn-admin hidden" onclick="window.location.href='admin.html'">🛡️ MENU ADM</button>

        <div class="main-content">
            <div class="left-buttons">
                <button class="btn-play" onclick="showScreen('combatScreen')">
                    <span style="font-size: 1.5em;">️</span>
                    JOGAR
                </button>
                <button class="btn-save" onclick="saveGame()">
                    <span style="font-size: 1.3em;">💾</span>
                    SALVAR
                </button>
                <button class="btn-load" onclick="loadGame()">
                    <span style="font-size: 1.3em;">📂</span>
                    CARREGAR
                </button>
                <button class="btn-new" onclick="if(confirm('Iniciar novo jogo?'))newGame()">
                    <span style="font-size: 1.3em;">➕</span>
                    NOVO JOGO
                </button>
            </div>

            <div class="center-character">
                <div style="position: relative; display: inline-block;">
                    <div class="character-silhouette">🥷</div>
                    <div class="character-dw">DW</div>
                </div>
            </div>

            <div class="right-side"></div>
        </div>

        <button class="btn-logout" id="logoutBtn">Sair</button>

    </div>
</div>

<!-- CHAT TOGGLE BUTTON -->
<button class="chat-toggle" id="chatToggle" onclick="toggleChat()">
    💬
    <span class="notification hidden" id="chatNotif">0</span>
</button>

<!-- CHAT PANEL -->
<div class="chat-panel" id="chatPanel">
    <div class="chat-header">
        <h3>💬 Chat do Servidor</h3>
        <button onclick="toggleChat()" style="width:auto;padding:5px 12px;background:#64748b;margin:0;">✕</button>
    </div>
    
    <div class="chat-tabs">
        <div class="chat-tab active" onclick="switchChatTab('global', this)">🌎 Global</div>
        <div class="chat-tab" onclick="switchChatTab('private', this)"> Privado</div>
    </div>

    <!-- GLOBAL CHAT -->
    <div id="globalChatView" style="display:flex;flex-direction:column;flex:1;">
        <div class="chat-messages" id="globalMessages"></div>
        <div class="chat-input-area">
            <input class="chat-input" id="globalInput" placeholder="Digite sua mensagem..." maxlength="200">
            <button class="chat-send" onclick="sendGlobalMessage()">Enviar</button>
        </div>
    </div>

    <!-- PRIVATE CHAT -->
    <div id="privateChatView" style="display:none;flex-direction:column;flex:1;">
        <div id="playersListContainer" class="players-list"></div>
        <div id="privateChatContainer" style="display:none;flex-direction:column;flex:1;">
            <div class="private-chat-header">
                <button onclick="backToPlayersList()">← Voltar</button>
                <div>
                    <div id="privateChatName" style="font-weight:bold;font-size:0.9em;"></div>
                    <div id="privateChatUid" style="font-size:0.7em;color:#64748b;"></div>
                </div>
            </div>
            <div class="chat-messages" id="privateMessages"></div>
            <div class="chat-input-area">
                <input class="chat-input" id="privateInput" placeholder="Mensagem privada..." maxlength="200">
                <button class="chat-send" onclick="sendPrivateMessage()">Enviar</button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot, serverTimestamp, collection, query, orderBy, limit, addDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgooL-9qYUyUaa7u0BvXg9i9gvXoZMOYc",
        authDomain: "dragon-war-rise-of-power-2a9f1.firebaseapp.com",
        projectId: "dragon-war-rise-of-power-2a9f1",
        storageBucket: "dragon-war-rise-of-power-2a9f1.firebasestorage.app",
        messagingSenderId: "115455691167",
        appId: "1:115455691167:web:ff3638f67b66c17c5515aa",
        measurementId: "G-S7XE2EN9CL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const SUPER_ADMIN_UIDS = ["DJ0865XZ51V7G5neeqVP2mr1h8T2"];

    let currentUserData = null;
    let currentUserId = null;
    let isUserAdmin = false;
    let heartbeatInterval = null;
    let playerRef = null;
    let chatOpen = false;
    let unreadMessages = 0;
    let currentPrivateChat = null;
    let allPlayers = [];

    const $ = id => document.getElementById(id);

    setTimeout(() => { $('loadingScreen').style.display = 'none'; }, 1000);

    window.showToast = (msg) => {
        const t = $('toast');
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    };

    window.showScreen = (screenId) => {
        if (screenId === 'gameView') {
            $('combatScreen')?.classList.add('hidden');
            $('gameView').classList.remove('hidden');
        } else if (screenId === 'combatScreen') {
            $('gameView').classList.add('hidden');
            if ($('combatScreen')) $('combatScreen').classList.remove('hidden');
        }
    };

    window.switchAuthTab = (tab) => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        
        if (tab === 'login') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            $('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            $('registerForm').classList.add('active');
        }
    };

    window.doLogin = async () => {
        const email = $('loginEmail').value.trim();
        const pass = $('loginPass').value;
        if (!email || !pass) return showToast('Preencha e-mail e senha.');
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            showToast('Bem-vindo de volta!');
        } catch(e) {
            showToast('Erro: ' + e.message);
        }
    };

    window.doRegister = async () => {
        const nick = $('regNick').value.trim();
        const email = $('regEmail').value.trim();
        const pass = $('regPass').value;
        if (!nick || !email || !pass) return showToast('Preencha todos os campos.');
        if (pass.length < 6) return showToast('Senha deve ter no mínimo 6 caracteres.');
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            await updateProfile(cred.user, { displayName: nick });
            await setDoc(doc(db, "players", cred.user.uid), {
                uid: cred.user.uid,
                nick: nick,
                email: email,
                coins: 1000,
                gems: 100,
                points: 0,
                level: 1,
                xp: 0,
                role: "player",
                vipLevel: 0,
                banned: false,
                godMode: false,
                createdAt: serverTimestamp(),
                lastSeen: serverTimestamp()
            });
            showToast('🎉 Conta criada! Bem-vindo ao Dragon War!');
        } catch(e) {
            showToast('Erro: ' + e.message);
        }
    };

    window.saveGame = async () => {
        if (!playerRef || !currentUserData) return showToast('Carregando dados...');
        try {
            await updateDoc(playerRef, {
                lastSave: serverTimestamp(),
                savedCoins: currentUserData.coins,
                savedGems: currentUserData.gems,
                savedLevel: currentUserData.level,
                savedPoints: currentUserData.points
            });
            showToast('💾 Jogo salvo com sucesso!');
        } catch(e) {
            showToast('Erro ao salvar: ' + e.message);
        }
    };

    window.loadGame = async () => {
        if (!playerRef || !currentUserData) return showToast('Carregando dados...');
        try {
            if (currentUserData.savedCoins !== undefined) {
                await updateDoc(playerRef, {
                    coins: currentUserData.savedCoins || 0,
                    gems: currentUserData.savedGems || 0,
                    level: currentUserData.savedLevel || 1,
                    points: currentUserData.savedPoints || 0
                });
                showToast(' Jogo carregado com sucesso!');
            } else {
                showToast('Nenhum jogo salvo encontrado.');
            }
        } catch(e) {
            showToast('Erro ao carregar: ' + e.message);
        }
    };

    window.newGame = async () => {
        if (!playerRef) return showToast('Carregando dados...');
        try {
            await updateDoc(playerRef, {
                coins: 0,
                gems: 0,
                points: 0,
                level: 1,
                xp: 0
            });
            showToast('🔄 Novo jogo iniciado!');
        } catch(e) {
            showToast('Erro: ' + e.message);
        }
    };

    // CHAT FUNCTIONS
    window.toggleChat = () => {
        chatOpen = !chatOpen;
        $('chatPanel').classList.toggle('active', chatOpen);
        if (chatOpen) {
            unreadMessages = 0;
            $('chatNotif').classList.add('hidden');
        }
    };

    window.switchChatTab = (tab, btn) => {
        document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        
        if (tab === 'global') {
            $('globalChatView').style.display = 'flex';
            $('privateChatView').style.display = 'none';
        } else {
            $('globalChatView').style.display = 'none';
            $('privateChatView').style.display = 'flex';
            renderPlayersList();
        }
    };

    window.sendGlobalMessage = async () => {
        const input = $('globalInput');
        const text = input.value.trim();
        if (!text) return;
        if (text.length > 200) return showToast('Mensagem muito longa!');
        
        try {
            await addDoc(collection(db, "chatMessages"), {
                type: "global",
                text: text,
                authorUid: currentUserId,
                authorNick: currentUserData.nick,
                authorRole: currentUserData.role || "player",
                authorVip: currentUserData.vipLevel || 0,
                createdAt: serverTimestamp()
            });
            input.value = '';
        } catch(e) {
            showToast('Erro ao enviar: ' + e.message);
        }
    };

    window.sendPrivateMessage = async () => {
        if (!currentPrivateChat) return;
        const input = $('privateInput');
        const text = input.value.trim();
        if (!text) return;
        
        try {
            const chatId = [currentUserId, currentPrivateChat.uid].sort().join('_');
            await addDoc(collection(db, "privateMessages"), {
                chatId: chatId,
                text: text,
                fromUid: currentUserId,
                fromNick: currentUserData.nick,
                toUid: currentPrivateChat.uid,
                toNick: currentPrivateChat.nick,
                createdAt: serverTimestamp()
            });
            input.value = '';
        } catch(e) {
            showToast('Erro ao enviar: ' + e.message);
        }
    };

    window.backToPlayersList = () => {
        currentPrivateChat = null;
        $('playersListContainer').style.display = 'block';
        $('privateChatContainer').style.display = 'none';
    };

    window.openPrivateChat = (player) => {
        currentPrivateChat = player;
        $('playersListContainer').style.display = 'none';
        $('privateChatContainer').style.display = 'flex';
        $('privateChatName').textContent = player.nick;
        $('privateChatUid').textContent = 'UID: ' + player.uid.substring(0, 12) + '...';
        loadPrivateMessages(player.uid);
    };

    function renderPlayersList() {
        const container = $('playersListContainer');
        const onlinePlayers = allPlayers.filter(p => p.uid !== currentUserId);
        
        if (onlinePlayers.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px;">Nenhum jogador online.</p>';
            return;
        }
        
        container.innerHTML = onlinePlayers.map(p => {
            const lastSeen = p.lastSeen?.toDate ? p.lastSeen.toDate().getTime() : 0;
            const isOnline = (Date.now() - lastSeen) < 60000;
            const isAdmin = p.role === "admin" || SUPER_ADMIN_UIDS.includes(p.uid);
            
            return `
                <div class="player-item" onclick="openPrivateChatWindow({uid:'${p.uid}',nick:'${p.nick}',role:'${p.role||'player'}'})">
                    <div class="player-item-avatar">${p.nick.charAt(0).toUpperCase()}</div>
                    <div class="player-item-info">
                        <div class="player-item-name">${isAdmin ? '👑 ' : ''}${p.nick}</div>
                        <div class="player-item-uid">UID: ${p.uid.substring(0, 10)}...</div>
                    </div>
                    <div class="player-item-status ${isOnline ? '' : 'offline'}"></div>
                </div>
            `;
        }).join('');
    }

    window.openPrivateChatWindow = (player) => {
        currentPrivateChat = player;
        $('playersListContainer').style.display = 'none';
        $('privateChatContainer').style.display = 'flex';
        $('privateChatName').textContent = player.nick;
        $('privateChatUid').textContent = 'UID: ' + player.uid.substring(0, 12) + '...';
        loadPrivateMessages(player.uid);
    };

    function loadPrivateMessages(otherUid) {
        const chatId = [currentUserId, otherUid].sort().join('_');
        const q = query(
            collection(db, "privateMessages"),
            where("chatId", "==", chatId),
            orderBy("createdAt", "asc"),
            limit(100)
        );
        
        onSnapshot(q, (snap) => {
            const container = $('privateMessages');
            if (snap.empty) {
                container.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px;">Nenhuma mensagem ainda. Inicie a conversa!</p>';
                return;
            }
            
            container.innerHTML = snap.docs.map(d => {
                const msg = d.data();
                const isOwn = msg.fromUid === currentUserId;
                const time = msg.createdAt?.toDate ? msg.createdAt.toDate().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) : '';
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="message-header">
                            <span class="message-author">${msg.fromNick}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        });
    }

    function loadGlobalMessages() {
        const q = query(
            collection(db, "chatMessages"),
            where("type", "==", "global"),
            orderBy("createdAt", "desc"),
            limit(100)
        );
        
        onSnapshot(q, (snap) => {
            const container = $('globalMessages');
            if (snap.empty) {
                container.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px;">Nenhuma mensagem ainda. Seja o primeiro!</p>';
                return;
            }
            
            const messages = snap.docs.map(d => ({id: d.id, ...d.data()})).reverse();
            
            container.innerHTML = messages.map(msg => {
                const isAdmin = msg.authorRole === "admin" || SUPER_ADMIN_UIDS.includes(msg.authorUid);
                const isOwn = msg.authorUid === currentUserId;
                const time = msg.createdAt?.toDate ? msg.createdAt.toDate().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) : '';
                
                let badges = '';
                if (isAdmin) badges += '<span class="badge-adm"> ADM</span>';
                if (msg.authorVip > 0) badges += `<span class="badge-vip">VIP ${msg.authorVip}</span>`;
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="message-header">
                            <span class="message-author" style="${isAdmin ? 'color:#c4b5fd;' : ''}">${msg.authorNick}</span>
                            ${badges}
                            <span class="message-uid">UID: ${msg.authorUid.substring(0, 10)}...</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
            
            if (!chatOpen && messages.length > 0) {
                const lastMsg = messages[messages.length - 1];
                if (lastMsg.authorUid !== currentUserId) {
                    unreadMessages++;
                    $('chatNotif').textContent = unreadMessages;
                    $('chatNotif').classList.remove('hidden');
                }
            }
        });
    }

    function loadAllPlayers() {
        const q = query(collection(db, "players"), limit(200));
        onSnapshot(q, (snap) => {
            allPlayers = snap.docs.map(d => d.data());
            if (chatOpen && $('privateChatView').style.display !== 'none') {
                renderPlayersList();
            }
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    onAuthStateChanged(auth, async (user) => {
        if (heartbeatInterval) clearInterval(heartbeatInterval);

        if (!user) {
            $('loadingScreen').style.display = 'none';
            $('authView').classList.remove('hidden');
            $('gameView').classList.add('hidden');
            return;
        }

        currentUserId = user.uid;
        $('authView').classList.add('hidden');
        $('loadingScreen').style.display = 'none';
        $('gameView').classList.remove('hidden');

        playerRef = doc(db, "players", user.uid);
        
        onSnapshot(playerRef, async (snap) => {
            if (!snap.exists()) return;

            const data = snap.data();
            currentUserData = data;

            if (data.banned) {
                alert('⛔ SUA CONTA FOI BANIDA.');
                signOut(auth);
                return;
            }

            isUserAdmin = SUPER_ADMIN_UIDS.includes(user.uid) || (data.role === "admin");

            $('playerAvatar').textContent = data.nick ? data.nick.charAt(0).toUpperCase() : '?';
            
            let nameHtml = `<span class="${isUserAdmin ? 'text-admin' : 'text-player'}">${data.nick || 'Jogador'}</span>`;
            if (isUserAdmin) {
                nameHtml += ` <span class="badge-adm">👑 ADM</span>`;
                nameHtml += ` <span class="badge-vip">VIP 10</span>`;
                $('btnOpenAdmin').classList.remove('hidden');
            } else {
                if (data.vipLevel && data.vipLevel > 0) {
                    nameHtml += ` <span class="badge-vip">VIP ${data.vipLevel}</span>`;
                }
                $('btnOpenAdmin').classList.add('hidden');
            }
            $('playerNameDisplay').innerHTML = nameHtml;
            $('playerUid').textContent = user.uid.substring(0, 12) + '...';

            $('resCoins').textContent = Number(data.coins || 0).toLocaleString('pt-BR');
            $('resGems').textContent = Number(data.gems || 0).toLocaleString('pt-BR');
            $('resPoints').textContent = Number(data.points || 0).toLocaleString('pt-BR');

            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(async () => {
                try { await updateDoc(playerRef, { lastSeen: serverTimestamp() }); } catch(e){}
            }, 20000);
            try { await updateDoc(playerRef, { lastSeen: serverTimestamp() }); } catch(e){}
        });

        loadGlobalMessages();
        loadAllPlayers();
    });

    $('logoutBtn').onclick = () => {
        signOut(auth).then(() => {
            showToast('Desconectado!');
            window.location.reload();
        });
    };

    $('globalInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendGlobalMessage();
    });

    $('privateInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendPrivateMessage();
    });
</script>

</body>
</html>
