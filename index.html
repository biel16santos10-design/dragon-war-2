<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon War — Jogo</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#05070b;
  color:#fff;
}
button,input,select{font:inherit}
button{cursor:pointer}
.topo{
  background:linear-gradient(135deg,#160b2d,#291052,#0b1220);
  border-bottom:2px solid #8b5cf6;
  padding:18px;
  position:sticky;
  top:0;
  z-index:20;
}
.topo h1{margin:0 0 6px;font-size:25px}
.topo p{margin:0;color:#cbd5e1}
.coroa{font-size:30px}
.container{max-width:1150px;margin:auto;padding:16px}
.painel{
  background:#0b1220;
  border:1px solid #263247;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 10px 30px #0006;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
label{display:block;color:#cbd5e1;font-size:14px;margin-bottom:5px}
input,select{
  width:100%;
  background:#05070b;color:#fff;
  border:1px solid #334155;
  border-radius:9px;
  padding:11px;
}
.btn{
  border:0;border-radius:10px;
  padding:11px 14px;
  background:#7c3aed;color:#fff;
  margin:5px 4px 0 0;
}
.btn:hover{filter:brightness(1.12)}
.btn.verde{background:#059669}
.btn.vermelho{background:#dc2626}
.btn.amarelo{background:#d97706}
.btn.azul{background:#2563eb}
.info{
  background:#111827;border-left:4px solid #8b5cf6;
  padding:12px;border-radius:8px;margin:10px 0 15px;
  color:#dbeafe;
}
.card{
  border:1px solid #293548;
  background:#0f172a;
  border-radius:13px;
  padding:14px;
  margin:10px 0;
}
.card h3{margin:0 0 8px}
.lista{display:grid;gap:10px}
.badge{
  display:inline-block;padding:4px 8px;border-radius:999px;
  background:#312e81;color:#ddd6fe;font-size:12px;
}
.badge.bloqueado{background:#7f1d1d;color:#fecaca}
.mini{color:#94a3b8;font-size:13px}
#status{margin:8px 0}
</style>
</head>

<body>

<header class="topo">
  <div class="container">
    <h1><span class="coroa">🐉</span> Dragon War — Rise of Power</h1>
    <p>Área do Jogador</p>
  </div>
</header>

<main class="container">

<div id="status"></div>

<section id="jogo-painel" class="painel">
  <h2>⚔️ Batalha e Aventura</h2>
  <div class="info">
    Escolha sua skin de avatar, enfrente os desafios, vença para avançar de fase e cuidado para sua vida não zerar!
  </div>
  
  <div class="card">
    <h3>👤 Escolher Avatar / Skin</h3>
    <div id="seletorSkins" class="grid" style="margin-top:10px;">
      <!-- As skins serão injetadas aqui via JavaScript -->
    </div>
  </div>

  <div class="card" id="batalha-container">
    <h3>🐉 Status da Batalha</h3>
    <p>HP do Jogador: <span id="hpJogador">100</span> / 100</p>
    <p>Fase Atual: <span id="faseAtual">1</span></p>
    <button class="btn verde" onclick="simularVitoria()">🏆 Simular Vitória da Fase</button>
    <button class="btn vermelho" onclick="simularDanoFatal()">💥 Simular Dano Fatal (Zerar HP)</button>
  </div>
</section>

</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyDA_kn3eNRD9P2D6WDCNbUxBKld0i9Sys",
  authDomain:"dragon-war-rise-of-power.firebaseapp.com",
  databaseURL:"https://dragon-war-rise-of-power-default-rtdb.firebaseio.com",
  projectId:"dragon-war-rise-of-power",
  storageBucket:"dragon-war-rise-of-power.firebasestorage.app",
  messagingSenderId:"1002858781019",
  appId:"1:1002858781019:web:6cd6d1b0173ab37c7fe27e",
  measurementId:"G-PY4TRBXZ8N"
};

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getDatabase(appFirebase);

const $=id=>document.getElementById(id);

function mensagem(texto,tipo=""){
  $("status").innerHTML=texto?`<div class="${tipo}">${texto}</div>`:"";
  if(texto)setTimeout(()=>$("status").innerHTML="",4000);
}

// ==========================================
// 8 Skins/Avatares (Algumas liberadas, algumas bloqueadas)
// ==========================================
const listaSkinsAvatares = [
  { id: "skin_1", nome: "Guerreiro Novato", img: "avatar1.png", bloqueado: false, preco: 0 },
  { id: "skin_2", nome: "Mago Aprendiz", img: "avatar2.png", bloqueado: false, preco: 0 },
  { id: "skin_3", nome: "Cavaleiro Real", img: "avatar3.png", bloqueado: true, preco: 300 },
  { id: "skin_4", nome: "Assassino das Sombras", img: "avatar4.png", bloqueado: true, preco: 500 },
  { id: "skin_5", nome: "Paladino Sagrado", img: "avatar5.png", bloqueado: true, preco: 800 },
  { id: "skin_6", nome: "Feiticeiro Caótico", img: "avatar6.png", bloqueado: true, preco: 1000 },
  { id: "skin_7", nome: "Titã de Magma", img: "avatar7.png", bloqueado: true, preco: 1500 },
  { id: "skin_8", nome: "Senhor dos Dragões", img: "avatar8.png", bloqueado: true, preco: 2500 }
];

function renderizarSkins() {
  const container = $("seletorSkins");
  container.innerHTML = listaSkinsAvatares.map(skin => `
    <div class="card" style="text-align:center; margin:0;">
      <h4>${skin.nome}</h4>
      <p class="mini">${skin.bloqueado ? '🔒 Bloqueado' : '✅ Desbloqueado'}</p>
      <p class="mini">💰 ${skin.preco} moedas</p>
      <button class="btn ${skin.bloqueado ? 'cinza' : 'azul'}" onclick="selecionarSkin('${skin.id}')">
        ${skin.bloqueado ? 'Desbloquear' : 'Usar Skin'}
      </button>
    </div>
  `).join("");
}

window.selecionarSkin = function(id) {
  const skin = listaSkinsAvatares.find(s => s.id === id);
  if (!skin) return;
  if (skin.bloqueado) {
    alert(`A skin "${skin.nome}" está bloqueada! Você precisa de ${skin.preco} moedas para desbloquear.`);
  } else {
    alert(`Skin "${skin.nome}" selecionada com sucesso!`);
  }
};

// ==========================================
// Função de Vitória (Exibe botão para próxima fase)
// ==========================================
window.acionouVitoriaBatalha = function() {
  const container = $("batalha-container");
  if (document.getElementById('btnProximaFase')) return;

  const btnFase = document.createElement('button');
  btnFase.id = 'btnProximaFase';
  btnFase.className = 'btn verde';
  btnFase.style.margin = '15px 0 0 0';
  btnFase.style.display = 'block';
  btnFase.innerHTML = '▶️ Ir para a Próxima Fase';
  btnFase.onclick = function() {
    let faseEl = $("faseAtual");
    let faseAtual = parseInt(faseEl.innerText) || 1;
    faseEl.innerText = faseAtual + 1;
    mensagem("Parabéns! Você avançou para a próxima fase.", "info");
    this.remove();
  };
  container.appendChild(btnFase);
};

// ==========================================
// Função de Derrota / Reinício (Vida zerada volta do começo)
// ==========================================
window.verificarDerrotaJogador = function(vidaAtual) {
  $("hpJogador").innerText = vidaAtual;
  if (vidaAtual <= 0) {
    alert("Sua vida chegou a zero! Você foi derrotado e vai reiniciar do começo.");
    localStorage.clear();
    location.reload();
  }
};

// Funções de teste rápido na interface
window.simularVitoria = function() {
  mensagem("Você venceu o inimigo desta fase!", "info");
  acionouVitoriaBatalha();
};

window.simularDanoFatal = function() {
  verificarDerrotaJogador(0);
};

// Inicialização anônima padrão para salvar dados do jogador no Firebase
signInAnonymously(auth).then(() => {
  renderizarSkins();
}).catch(e => {
  console.error(e);
  mensagem("❌ Erro ao conectar ao Firebase.", "erro");
});
</script>

</body>
</html>
