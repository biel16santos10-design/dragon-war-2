<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon War — Rise of Power</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    height: 100vh;
}

/* LOADING */
#loadingScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 9999;
}
.spinner {
    width: 60px; height: 60px;
    border: 5px solid #333; border-top: 5px solid #ff6b00;
    border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.loading-text { margin-top: 20px; color: #ff6b00; font-size: 1.2em; font-weight: bold; }

/* AUTH */
.auth-container {
    display: flex; justify-content: center; align-items: center;
    height: 100vh; padding: 20px;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
}
.auth-card {
    background: rgba(30, 41, 59, 0.95);
    border: 2px solid #ff6b00;
    border-radius: 20px; padding: 40px;
    max-width: 500px; width: 100%;
    box-shadow: 0 20px 60px rgba(255, 107, 0, 0.4);
}
.auth-card h1 {
    text-align: center; font-size: 3em; margin-bottom: 10px;
    background: linear-gradient(135deg, #ff6b00, #ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.auth-card .subtitle { text-align: center; color: #94a3b8; letter-spacing: 4px; margin-bottom: 30px; }
.auth-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
.auth-tab {
    flex: 1; padding: 14px; background: #0f172a; border: 2px solid #334155;
    border-radius: 10px; color: #fff; cursor: pointer; font-weight: bold;
    text-align: center; transition: all 0.3s;
}
.auth-tab.active { background: #ff6b00; border-color: #ff6b00; }
.auth-form { display: none; }
.auth-form.active { display: block; }

input {
    width: 100%; padding: 14px; margin: 10px 0;
    border-radius: 10px; border: 2px solid #334155;
    background: #0f172a; color: #fff; font-size: 15px;
}
input:focus { outline: none; border-color: #ff6b00; }

button {
    width: 100%; padding: 14px; margin: 10px 0;
    border-radius: 10px; border: none; font-weight: bold;
    font-size: 15px; cursor: pointer; text-transform: uppercase;
    transition: all 0.3s;
}
button:hover { transform: translateY(-2px); filter: brightness(1.2); }

.btn-primary { background: linear-gradient(135deg, #ff6b00, #ff4500); color: #fff; }
.btn-success { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; }

/* GAME SCREEN - MAIN MENU */
#gameView {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1920&q=80') center/cover;
    overflow: hidden;
}
#gameView::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(10, 14, 39, 0.7) 0%, rgba(26, 31, 58, 0.5) 100%);
    z-index: 1;
}

.game-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px;
    z-index: 10;
}

/* PLAYER PROFILE */
.player-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px 15px;
    border-radius: 12px;
    border: 2px solid #3b82f6;
    backdrop-filter: blur(10px);
}
.player-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    border: 2px solid #ffd700;
}
.player-info h3 {
    font-size: 1.2em;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
}
.player-info .uid {
    font-size: 0.85em;
    color: #94a3b8;
}
.text-admin { color: #c4b5fd; text-shadow: 0 0 10px rgba(196, 181, 253, 0.6); }
.text-player { color: #fff; }
.badge-adm { background: #7c3aed; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; }
.badge-vip { background: #ffd700; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; }

/* LOGO */
.game-logo {
    text-align: center;
    flex: 1;
}
.logo-dragon {
    font-size: 4em;
    filter: drop-shadow(0 0 20px rgba(255, 107, 0, 0.8));
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.logo-text {
    font-size: 3.5em;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b00, #ff4500, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
    letter-spacing: 2px;
    line-height: 1;
}
.logo-subtitle {
    font-size: 1.2em;
    color: #fff;
    letter-spacing: 8px;
    margin-top: 5px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* CONFIG BUTTON */
.config-btn {
    width: auto;
    padding: 10px 20px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid #64748b;
    border-radius: 12px;
    color: #fff;
    font-size: 0.9em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    backdrop-filter: blur(10px);
}
.config-btn:hover { border-color: #ff6b00; }

/* MAIN CONTENT */
.main-content {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    position: relative;
}

/* LEFT BUTTONS */
.left-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    z-index: 10;
}

.btn-play {
    width: 280px;
    padding: 25px;
    background: linear-gradient(135deg, #ff6b00, #ff4500);
    border: 3px solid #ffd700;
    border-radius: 15px;
    font-size: 2em;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 0 30px rgba(255, 107, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.3);
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 107, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.3); }
    50% { box-shadow: 0 0 50px rgba(255, 107, 0, 0.9), inset 0 0 30px rgba(255, 215, 0, 0.5); }
}
.btn-play:hover { transform: scale(1.05); }

.btn-save {
    width: 220px;
    padding: 18px;
    background: linear-gradient(135deg, #22c55e, #15803d);
    border: 2px solid #4ade80;
    border-radius: 12px;
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
}

.btn-load {
    width: 220px;
    padding: 18px;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    border: 2px solid #22d3ee;
    border-radius: 12px;
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
}

.btn-new {
    width: 220px;
    padding: 18px;
    background: linear-gradient(135deg, #64748b, #475569);
    border: 2px solid #94a3b8;
    border-radius: 12px;
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 0 20px rgba(100, 116, 139, 0.5);
}

/* CENTER CHARACTER */
.center-character {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
}
.character-silhouette {
    font-size: 200px;
    filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.8));
    animation: glow 2s ease-in-out infinite;
}
@keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.8)); }
    50% { filter: drop-shadow(0 0 60px rgba(59, 130, 246, 1)); }
}
.character-dw {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3em;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(59, 130, 246, 1);
}

/* RIGHT SIDE - EMPTY FOR NOW */
.right-side {
    width: 280px;
}

/* RESOURCES BAR */
.resources-bar {
    position: absolute;
    top: 100px;
    right: 20px;
    display: flex;
    gap: 15px;
    z-index: 10;
}
.resource-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px 15px;
    border-radius: 10px;
    border: 1px solid #ffd700;
    backdrop-filter: blur(10px);
}
.resource-icon { font-size: 1.5em; }
.resource-value { font-size: 1.2em; font-weight: bold; color: #ffd700; }

/* ADMIN BUTTON */
.btn-admin {
    position: absolute;
    top: 180px;
    right: 20px;
    width: auto;
    padding: 10px 20px;
    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    border: 2px solid #a78bfa;
    border-radius: 10px;
    color: #fff;
    font-size: 0.9em;
    z-index: 10;
}

.btn-logout {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: auto;
    padding: 10px 20px;
    background: rgba(239, 68, 68, 0.8);
    border: 2px solid #ef4444;
    border-radius: 10px;
    color: #fff;
    font-size: 0.9em;
    z-index: 10;
}

/* TOAST */
#toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.9);
    border: 2px solid #ff6b00;
    color: #fff;
    padding: 15px 30px;
    border-radius: 12px;
    display: none;
    z-index: 9999;
    font-weight: bold;
    box-shadow: 0 0 30px rgba(255, 107, 0, 0.6);
}

.hidden { display: none !important; }

@media (max-width: 768px) {
    .logo-text { font-size: 2em; }
    .logo-subtitle { font-size: 0.8em; letter-spacing: 4px; }
    .btn-play { width: 200px; font-size: 1.5em; padding: 15px; }
    .btn-save, .btn-load, .btn-new { width: 180px; font-size: 1em; }
    .character-silhouette { font-size: 120px; }
    .main-content { padding: 0 20px; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">Carregando Dragon War...</div>
</div>

<!-- AUTH VIEW -->
<div id="authView" class="hidden">
    <div class="auth-container">
        <div class="auth-card">
            <h1>DRAGON WAR</h1>
            <p class="subtitle">RISE OF POWER</p>
            
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">Entrar</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">Criar Conta</div>
            </div>

            <div id="loginForm" class="auth-form active">
                <input id="loginEmail" type="email" placeholder="E-mail">
                <input id="loginPass" type="password" placeholder="Senha">
                <button class="btn-primary" onclick="doLogin()">ENTRAR</button>
            </div>

            <div id="registerForm" class="auth-form">
                <input id="regNick" placeholder="Nome do Personagem">
                <input id="regEmail" type="email" placeholder="E-mail">
                <input id="regPass" type="password" placeholder="Senha (mín. 6 caracteres)">
                <button class="btn-success" onclick="doRegister()">CADASTRAR</button>
            </div>
        </div>
    </div>
</div>

<!-- GAME VIEW -->
<div id="gameView" class="hidden">
    <div class="game-content">
        
        <!-- TOP BAR -->
        <div class="top-bar">
            <!-- PLAYER PROFILE -->
            <div class="player-profile">
                <div class="player-avatar" id="playerAvatar">?</div>
                <div class="player-info">
                    <h3 id="playerNameDisplay">Carregando...</h3>
                    <div class="uid">UID: <span id="playerUid">---</span></div>
                </div>
            </div>

            <!-- LOGO -->
            <div class="game-logo">
                <div class="logo-dragon">🐉</div>
                <div class="logo-text">DRAGON WAR</div>
                <div class="logo-subtitle">RISE OF POWER</div>
            </div>

            <!-- CONFIG -->
            <button class="config-btn" onclick="showToast('⚙️ Configurações em desenvolvimento!')">
                <span style="font-size: 1.5em;">⚙️</span>
                <span>Config.</span>
            </button>
        </div>

        <!-- RESOURCES -->
        <div class="resources-bar">
            <div class="resource-item">
                <span class="resource-icon"></span>
                <span class="resource-value" id="resCoins">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">💎</span>
                <span class="resource-value" id="resGems">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">⭐</span>
                <span class="resource-value" id="resPoints">0</span>
            </div>
        </div>

        <!-- ADMIN BUTTON -->
        <button id="btnOpenAdmin" class="btn-admin hidden" onclick="window.location.href='admin.html'">🛡️ MENU ADM</button>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- LEFT BUTTONS -->
            <div class="left-buttons">
                <button class="btn-play" onclick="showToast('️ Iniciando jogo...')">
                    <span style="font-size: 1.5em;">⚔️</span>
                    JOGAR
                </button>
                <button class="btn-save" onclick="showToast('💾 Jogo salvo!')">
                    <span style="font-size: 1.3em;">💾</span>
                    SALVAR
                </button>
                <button class="btn-load" onclick="showToast(' Jogo carregado!')">
                    <span style="font-size: 1.3em;">📂</span>
                    CARREGAR
                </button>
                <button class="btn-new" onclick="if(confirm('Iniciar novo jogo?'))showToast('🔄 Novo jogo iniciado!')">
                    <span style="font-size: 1.3em;">➕</span>
                    NOVO JOGO
                </button>
            </div>

            <!-- CENTER CHARACTER -->
            <div class="center-character">
                <div style="position: relative; display: inline-block;">
                    <div class="character-silhouette"></div>
                    <div class="character-dw">DW</div>
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="right-side"></div>
        </div>

        <!-- LOGOUT -->
        <button class="btn-logout" id="logoutBtn">Sair</button>

    </div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgooL-9qYUyUaa7u0BvXg9i9gvXoZMOYc",
        authDomain: "dragon-war-rise-of-power-2a9f1.firebaseapp.com",
        projectId: "dragon-war-rise-of-power-2a9f1",
        storageBucket: "dragon-war-rise-of-power-2a9f1.firebasestorage.app",
        messagingSenderId: "115455691167",
        appId: "1:115455691167:web:ff3638f67b66c17c5515aa",
        measurementId: "G-S7XE2EN9CL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const SUPER_ADMIN_UIDS = ["DJ0865XZ51V7G5neeqVP2mr1h8T2"];

    let currentUserData = null;
    let isUserAdmin = false;
    let heartbeatInterval = null;
    let playerRef = null;

    const $ = id => document.getElementById(id);

    setTimeout(() => { $('loadingScreen').style.display = 'none'; }, 1000);

    window.showToast = (msg) => {
        const t = $('toast');
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    };

    window.switchAuthTab = (tab) => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        
        if (tab === 'login') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            $('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            $('registerForm').classList.add('active');
        }
    };

    window.doLogin = async () => {
        const email = $('loginEmail').value.trim();
        const pass = $('loginPass').value;
        if (!email || !pass) return showToast('Preencha e-mail e senha.');
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            showToast('Bem-vindo de volta!');
        } catch(e) {
            showToast('Erro: ' + e.message);
        }
    };

    window.doRegister = async () => {
        const nick = $('regNick').value.trim();
        const email = $('regEmail').value.trim();
        const pass = $('regPass').value;
        if (!nick || !email || !pass) return showToast('Preencha todos os campos.');
        if (pass.length < 6) return showToast('Senha deve ter no mínimo 6 caracteres.');
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            await updateProfile(cred.user, { displayName: nick });
            await setDoc(doc(db, "players", cred.user.uid), {
                uid: cred.user.uid,
                nick: nick,
                email: email,
                coins: 0,
                gems: 0,
                points: 0,
                level: 1,
                xp: 0,
                role: "player",
                vipLevel: 0,
                banned: false,
                godMode: false,
                createdAt: serverTimestamp(),
                lastSeen: serverTimestamp()
            });
            showToast(' Conta criada! Bem-vindo ao Dragon War!');
        } catch(e) {
            showToast('Erro: ' + e.message);
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (heartbeatInterval) clearInterval(heartbeatInterval);

        if (!user) {
            $('loadingScreen').style.display = 'none';
            $('authView').classList.remove('hidden');
            $('gameView').classList.add('hidden');
            return;
        }

        $('authView').classList.add('hidden');
        $('loadingScreen').style.display = 'none';
        $('gameView').classList.remove('hidden');

        playerRef = doc(db, "players", user.uid);
        
        onSnapshot(playerRef, async (snap) => {
            if (!snap.exists()) return;

            const data = snap.data();
            currentUserData = data;

            if (data.banned) {
                alert('⛔ SUA CONTA FOI BANIDA.');
                signOut(auth);
                return;
            }

            isUserAdmin = SUPER_ADMIN_UIDS.includes(user.uid) || (data.role === "admin");

            $('playerAvatar').textContent = data.nick ? data.nick.charAt(0).toUpperCase() : '?';
            
            let nameHtml = `<span class="${isUserAdmin ? 'text-admin' : 'text-player'}">${data.nick || 'Jogador'}</span>`;
            if (isUserAdmin) {
                nameHtml += ` <span class="badge-adm">👑 ADM</span>`;
                nameHtml += ` <span class="badge-vip">VIP 10</span>`;
                $('btnOpenAdmin').classList.remove('hidden');
            } else {
                if (data.vipLevel && data.vipLevel > 0) {
                    nameHtml += ` <span class="badge-vip">VIP ${data.vipLevel}</span>`;
                }
                $('btnOpenAdmin').classList.add('hidden');
            }
            $('playerNameDisplay').innerHTML = nameHtml;
            $('playerUid').textContent = user.uid.substring(0, 12) + '...';

            $('resCoins').textContent = Number(data.coins || 0).toLocaleString('pt-BR');
            $('resGems').textContent = Number(data.gems || 0).toLocaleString('pt-BR');
            $('resPoints').textContent = Number(data.points || 0).toLocaleString('pt-BR');

            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(async () => {
                try { await updateDoc(playerRef, { lastSeen: serverTimestamp() }); } catch(e){}
            }, 20000);
            try { await updateDoc(playerRef, { lastSeen: serverTimestamp() }); } catch(e){}
        });
    });

    $('logoutBtn').onclick = () => {
        signOut(auth).then(() => {
            showToast('Desconectado!');
            window.location.reload();
        });
    };
</script>

</body>
    </html>
