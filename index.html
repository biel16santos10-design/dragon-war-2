<head>
<meta charset="UTF-8">

<title>Dragon War - Rise of Power | Servidor Oficial</title>
<style>
:root{--bg-color:#0b0f19;--panel-bg:#131b2e;--panel-border:#1e293b;--accent-color:#f59e0b;--adm-color:#ef4444;--diamond-color:#38bdf8;--text-color:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background-color:var(--bg-color);color:var(--text-color);height:100vh;display:flex;overflow:hidden}
.screen{width:100%;height:100%;display:flex;justify-content:center;align-items:center;position:absolute;top:0;left:0;background:radial-gradient(circle,#1e293b 0%,#0b0f19 100%);z-index:10}
.hidden{display:none!important}
.card{background:var(--panel-bg);padding:30px;border-radius:12px;width:380px;box-shadow:0 10px 25px rgba(0,0,0,.8);border:2px solid var(--accent-color);text-align:center}
.card img.logo-login{width:100%;max-height:90px;object-fit:contain;margin-bottom:20px;border-radius:6px}
.card h2{margin-bottom:20px;color:var(--accent-color);font-size:20px;text-transform:uppercase;letter-spacing:1px}
.input-group{margin-bottom:15px;text-align:left}.input-group label{display:block;margin-bottom:5px;font-size:14px;color:#94a3b8}
.input-group input{width:100%;padding:10px;border-radius:6px;border:1px solid var(--panel-border);background:#070a12;color:white}
.btn{width:100%;padding:10px;background:linear-gradient(90deg,#f59e0b,#d97706);border:none;color:#000;font-weight:bold;border-radius:6px;cursor:pointer;transition:.2s;text-transform:uppercase}
.btn:hover{opacity:.9;transform:translateY(-1px)}.btn-adm{background:linear-gradient(90deg,#ef4444,#b91c1c);color:white;margin-top:10px}
.btn-blue{background:linear-gradient(90deg,#38bdf8,#0284c7);color:#000}
.btn-green{background:linear-gradient(90deg,#10b981,#059669);color:white}
.btn-purple{background:linear-gradient(90deg,#8b5cf6,#6d28d9);color:white}
.btn-gray{background:#334155;color:white}
.auth-switch{margin-top:15px;font-size:13px;color:#94a3b8;cursor:pointer}.auth-switch:hover{color:var(--accent-color);text-decoration:underline}
