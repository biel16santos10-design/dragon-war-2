<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon War - Rise of Power</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
      font-size: 1.8rem;
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: #94a3b8;
      font-weight: bold;
    }
    .tab.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .hidden {
      display: none;
    }
    #game-screen {
      text-align: center;
    }
    .user-info {
      margin: 20px 0;
      padding: 15px;
      background: #0f172a;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Dragon War</h1>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen">
      <div class="tabs">
        <div class="tab active" id="tab-login" onclick="showForm('login')">LOGIN</div>
        <div class="tab" id="tab-register" onclick="showForm('register')">CRIAR CONTA</div>
      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="login-password">Palavra-passe</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit">ENTRAR NO JOGO</button>
      </form>

      <!-- FORMULÁRIO DE REGISTO -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-username">Nome de Jogador</label>
          <input type="text" id="reg-username" required placeholder="Ex: Guerriro123">
        </div>
        <div class="form-group">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Palavra-passe</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <button type="submit">CRIAR CONTA</button>
      </form>
    </div>

    <!-- TELA DO JOGO (PÓS-LOGIN) -->
    <div id="game-screen" class="hidden">
      <h2>Bem-vindo, <span id="player-name">---</span>!</h2>
      <div class="user-info">
        <p><strong>Nível:</strong> <span id="player-level">1</span></p>
        <p><strong>Moedas:</strong> <span id="player-coins">100</span></p>
      </div>
      <button onclick="handleLogout()" style="background: #ef4444;">SAIR DA CONTA</button>
    </div>
  </div>

  <!-- FIREBASE SDKs (COMPATIBILIDADE BROWSER) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- LÓGICA DO JOGO E CONEXÃO COM O FIREBASE -->
  <script>
    // Configurações do seu projeto Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDgooL-9qYUyUaa7u0BvXg9i9gvXoZMOYc",
      authDomain: "dragon-war-rise-of-power-2a9f1.firebaseapp.com",
      projectId: "dragon-war-rise-of-power-2a9f1",
      storageBucket: "dragon-war-rise-of-power-2a9f1.firebasestorage.app",
      messagingSenderId: "115455691167",
      appId: "1:115455691167:web:ff3638f67b66c17c5515aa",
      measurementId: "G-S7XE2EN9CL"
    };

    // Inicialização do Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Alternar entre abas de Login e Registo
    function showForm(type) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
      }
    }

    // Função de Registo de Jogador
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Salvar os dados iniciais do jogador no Firestore
        await db.collection('users').doc(user.uid).set({
          username: name,
          email: email,
          level: 1,
          coins: 100,
          createdAt: new Date()
        });

        alert("Conta criada com sucesso!");
      } catch (error) {
        alert("Erro no registo: " + error.message);
      }
    }

    // Função de Login
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        alert("Erro ao entrar: " + error.message);
      }
    }

    // Função de Terminar Sessão
    function handleLogout() {
      auth.signOut();
    }

    // Monitorizar Estado do Utilizador em Tempo Real
    auth.onAuthStateChanged(async (user) => {
      const authScreen = document.getElementById('auth-screen');
      const gameScreen = document.getElementById('game-screen');

      if (user) {
        // Carregar dados do Firestore
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('player-name').innerText = data.username || "Jogador";
          document.getElementById('player-level').innerText = data.level || 1;
          document.getElementById('player-coins').innerText = data.coins || 100;
        }

        authScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
      } else {
        authScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
