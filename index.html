<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon War - Rise of Power</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        .screen.active {
            display: flex;
        }
        /* Estilos da Tela Inicial */
        #home-screen {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('fundo-dragon.jpg') no-repeat center center/cover;
            justify-content: space-between;
            padding: 40px;
        }
        .home-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn-play {
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: white;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(241, 39, 17, 0.4);
            transition: 0.2s;
        }
        .btn-play:hover {
            transform: scale(1.05);
        }
        .menu-btn {
            background: rgba(16, 37, 66, 0.8);
            color: #fff;
            padding: 12px 25px;
            border: 1px solid #1e90ff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            width: 200px;
        }
        .menu-btn:hover {
            background: rgba(30, 144, 255, 0.3);
        }
        /* Estilos do Jogo Principal / Dashboard */
        #game-screen {
            background: #0f172a;
            display: grid;
            grid-template-columns: 240px 1fr;
        }
        .sidebar {
            background: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-right: 1px solid #334155;
        }
        .sidebar button {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 12px;
            text-align: left;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .sidebar button.active, .sidebar button:hover {
            background: #3b82f6;
            color: #fff;
        }
        .content-area {
            padding: 30px;
            overflow-y: auto;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- TELA 1: MENU INICIAL -->
    <div id="home-screen" class="screen active">
        <div class="home-left">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="user-avatar" src="avatar.png" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #f5af19;" alt="Avatar">
                <div>
                    <h3 id="display-name">Gabriel Cabral</h3>
                    <small style="color: #94a3b8;">UID: <span id="display-uid">12345678</span></small>
                </div>
            </div>
            <button class="btn-play" onclick="entrarNoJogo()">JOGAR</button>
            <button class="menu-btn" onclick="abrirSalvar()">📄 SALVAR</button>
            <button class="menu-btn" onclick="abrirCarregar()">📂 CARREGAR</button>
            <button class="menu-btn" onclick="abrirNovoJogo()">➕ NOVO JOGO</button>
        </div>
    </div>

    <!-- TELA 2: PAINEL DO JOGO (COM ABAS) -->
    <div id="game-screen" class="screen">
        <div class="sidebar">
            <h2 style="color: #f5af19; margin-bottom: 20px;">DRAGON WAR</h2>
            <button onclick="mudarAba('resumo', this)">Resumo</button>
            <button onclick="mudarAba('campanha', this)">Campanha</button>
            <button onclick="mudarAba('loja', this)" class="active">Loja de Itens</button>
            <button onclick="mudarAba('poderes', this)">Poderes</button>
            <button onclick="mudarAba('inventario', this)">Inventário</button>
            <button onclick="mudarAba('admin', this)">Painel ADM</button>
        </div>
        <div class="content-area">
            <!-- ABA RESUMO -->
            <div id="resumo" class="tab-content">
                <h2>Resumo do Herói</h2>
                <p>Estatísticas e dados gerais da conta conectados ao Firebase.</p>
            </div>

            <!-- ABA CAMPANHA / BOSSES -->
            <div id="campanha" class="tab-content">
                <h2>Batalha contra Chefões</h2>
                <!-- Cards de Bosses aqui -->
            </div>

            <!-- ABA LOJA -->
            <div id="loja" class="tab-content active">
                <h2>Loja de Itens</h2>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px;">
                    <!-- Exemplo de Item da Loja -->
                    <div style="background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #3b82f6; text-align: center;">
                        <h4>Lâmina do Dragão</h4>
                        <p style="color: #f5af19; margin: 10px 0;">5.000 Moedas</p>
                        <button onclick="comprarItem('Lamina do Dragao', 5000)" style="background: #22c55e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">COMPRAR</button>
                    </div>
                </div>
            </div>

            <!-- ABA PODERES -->
            <div id="poderes" class="tab-content">
                <h2>Árvore de Habilidades</h2>
            </div>

            <!-- ABA INVENTÁRIO -->
            <div id="inventario" class="tab-content">
                <h2>Inventário / Mochila</h2>
            </div>

            <!-- ABA ADMIN -->
            <div id="admin" class="tab-content">
                <h2>Painel Administrativo</h2>
            </div>
        </div>
    </div>

    <script>
        // Função para alternar entre a Tela Inicial e o Jogo
        function entrarNoJogo() {
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        }

        // Função para alternar as abas internas do jogo
        function mudarAba(nomeAba, elementoBtn) {
            // Remove active de todas as abas e botões
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.sidebar button').forEach(btn => btn.classList.remove('active'));

            // Ativa a aba e o botão correspondente
            document.getElementById(nomeAba).classList.add('active');
            if(elementoBtn) elementoBtn.classList.add('active');
        }

        function abrirNovoJogo() {
            let nome = prompt("Digite o nome do seu personagem:");
            let email = prompt("Digite o seu e-mail:");
            if(nome && email) {
                alert(`Perfil de ${nome} criado com sucesso! Dados prontos para salvar no Firebase.`);
                // Aqui você insere a chamada para salvar/criar o usuário no Firestore
            }
        }

        function abrirSalvar() {
            alert("Progresso salvo com sucesso no Firebase!");
        }

        function abrirCarregar() {
            alert("Carregando dados da conta...");
        }

        function comprarItem(nomeItem, preco) {
            // Lógica de compra integrada com saldo do Firestore
            alert(`Você comprou: ${nomeItem} por ${preco} moedas! Item adicionado ao inventário.`);
        }
    </script>
</body>
</html>
