<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon War: Rise of Power</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }

        .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; justify-content: space-between; padding: 25px; z-index: 2; }
        .screen.active { display: flex; }

        /* Fundo Épico do Jogo */
        .game-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('https://raw.githubusercontent.com/santos10-design/santos10-design.github.io/main/fundo-dragon.jpg') no-repeat center center/cover;
            z-index: 1;
        }

        /* 1 & 2. Telas de Entrada / Registro */
        .auth-screen-bg { background: linear-gradient(135deg, rgba(11,15,25,0.95), rgba(15,23,42,0.98)); justify-content: center; align-items: center; z-index: 10; }
        .auth-container { background: rgba(30, 41, 59, 0.9); border: 1px solid #3b82f6; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; backdrop-filter: blur(10px); }
        .auth-container h2 { text-align: center; color: #f5af19; margin-bottom: 5px; }
        .auth-container input { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; font-size: 14px; }
        .btn-auth { background: linear-gradient(135deg, #f5af19, #f12711); color: white; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .btn-auth:hover { filter: brightness(1.1); }
        .switch-auth { text-align: center; font-size: 13px; color: #94a3b8; cursor: pointer; margin-top: 5px; }
        .switch-auth:hover { color: #38bdf8; text-decoration: underline; }

        /* 3. Tela Principal / Hub */
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; z-index: 3; }
        .player-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); padding: 12px 18px; border-radius: 12px; display: flex; align-items: center; gap: 15px; backdrop-filter: blur(8px); }
        .player-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #f5af19; object-fit: cover; background: #334155; }
        .player-info h4 { font-size: 16px; color: #fff; }
        .player-info p { font-size: 12px; color: #94a3b8; }
        
        .top-actions { display: flex; gap: 10px; }
        .icon-btn { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; backdrop-filter: blur(8px); position: relative; }
        .badge-notification { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }

        .main-menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; z-index: 3; margin-bottom: 20px; }
        .btn-menu { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 14px 20px; border-radius: 10px; color: white; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .btn-menu:hover { background: rgba(30, 41, 59, 0.95); transform: scale(1.02); }
        .btn-play { background: linear-gradient(135deg, #f5af19, #f12711); border-color: #f5af19; font-size: 18px; justify-content: center; box-shadow: 0 4px 15px rgba(245, 175, 25, 0.4); }
        .btn-save { border-left: 4px solid #22c55e; }
        .btn-load { border-left: 4px solid #38bdf8; }
        .btn-new { border-left: 4px solid #a855f7; }

        /* Modal Geral */
        #modal-conteudo { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 15, 25, 0.95); z-index: 100; padding: 30px; overflow-y: auto; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .btn-fechar { background: #ef4444; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Estilo de Mensagens do ADM no Chat */
        .chat-msg-adm { background: rgba(15, 23, 42, 0.9); border-left: 4px solid #7c3aed; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; }
        .adm-name { color: #64748b; font-weight: bold; font-size: 13px; } /* Nome meio escuro/apagado */
        .adm-badge { background: #7c3aed; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. TELA DE ENTRADA (LOGIN) -->
    <div id="login-screen" class="screen active auth-screen-bg">
        <div class="auth-container">
            <h2>🐉 Dragon War</h2>
            <p style="text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 5px;">Rise of Power</p>
            <input type="email" id="login-email" placeholder="E-mail">
            <input type="password" id="login-senha" placeholder="Senha">
            <button class="btn-auth" onclick="fazerLogin()">🔵 ENTRAR</button>
            <div class="switch-auth" onclick="mostrarRegistro()">REGISTRAR-SE</div>
        </div>
    </div>

    <!-- 2. TELA DE REGISTRO -->
    <div id="register-screen" class="screen auth-screen-bg">
        <div class="auth-container">
            <h2>REGISTRAR-SE</h2>
            <input type="text" id="reg-nome" placeholder="👤 Nome de usuário">
            <input type="email" id="reg-email" placeholder="📧 E-mail">
            <input type="password" id="reg-senha" placeholder="🔒 Senha">
            <input type="password" id="reg-confirmar" placeholder="🔒 Confirmar senha">
            <button class="btn-auth" style="background: linear-gradient(135deg, #22c55e, #15803d);" onclick="fazerRegistro()">🟢 CRIAR CONTA</button>
            <div class="switch-auth" onclick="mostrarLogin()">Já tem uma conta? Entrar</div>
        </div>
    </div>

    <!-- 3. TELA PRINCIPAL (HUB DO JOGADOR) -->
    <div id="main-screen" class="screen">
        <div class="game-background"></div>
        
        <!-- Topo: Perfil e Atalhos (Sininho + Configurações) -->
        <div class="top-bar">
            <div class="player-card">
                <img id="hud-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=hero" class="player-avatar" alt="Avatar">
                <div class="player-info">
                    <h4 id="hud-nome">Gabriel Cabral 👑</h4>
                    <p>UID: <span id="hud-uid">12345678</span> | Nível: <span id="hud-nivel">1</span> | Rank: <span id="hud-rank">Bronze</span></p>
                    <p style="margin-top: 4px; font-size: 11px; color: #f5af19;">
                        ⚔️ Espada: <span id="hud-espada">Lâmina Iniciante</span>
                    </p>
                    <p style="margin-top: 2px; font-size: 11px; color: #38bdf8;">
                        💰 <span id="hud-moedas">15.000</span> | 💎 <span id="hud-diamantes">100</span> | 🏆 <span id="hud-pontos">0</span>
                    </p>
                </div>
            </div>
            <div class="top-actions">
                <!-- Sininho de Atualizações -->
                <div class="icon-btn" onclick="abrirAtualizacoes()" title="Atualizações">
                    🔔<span class="badge-notification">1</span>
                </div>
                <div class="icon-btn" onclick="abrirConfiguracoesPerfil()" title="Configurações">⚙️</div>
            </div>
        </div>

        <!-- Menu Principal de Ações -->
        <div class="main-menu">
            <button class="btn-menu btn-play" onclick="entrarModoJogar()">⚔️ JOGAR</button>
            <button class="btn-menu btn-save" onclick="salvarProgressoJogo()">💾 SALVAR</button>
            <button class="btn-menu btn-load" onclick="carregarProgressoJogo()">📂 CARREGAR</button>
            <button class="btn-menu btn-new" onclick="iniciarNovoJogo()">➕ NOVO JOGO</button>
            <button class="btn-menu" style="border-left: 4px solid #eab308;" onclick="abrirChatGlobal()">💬 Chat & Comunidade</button>
            <button class="btn-menu" style="border-left: 4px solid #ec4899;" onclick="abrirArvoreHabilidades()">🌳 Árvore de Habilidades</button>
        </div>
    </div>

    <!-- MODAL PARA SISTEMAS -->
    <div id="modal-conteudo">
        <div class="modal-header">
            <h2 id="modal-titulo" style="color: #f5af19;">Painel</h2>
            <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
        </div>
        <div id="modal-corpo" style="flex: 1; overflow-y: auto;"></div>
    </div>

    <script>
        let jogadorAtual = {
            nome: "Gabriel Cabral",
            uid: "12345678",
            nivel: 1,
            rank: "Bronze",
            moedas: 15000,
            diamantes: 100,
            pontos: 0,
            espada: "Lâmina Iniciante",
            avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=hero"
        };

        function mostrarRegistro() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('register-screen').classList.add('active');
        }

        function mostrarLogin() {
            document.getElementById('register-screen').classList.remove('active');
            document.getElementById('login-screen').classList.add('active');
        }

        function fazerRegistro() {
            let nome = document.getElementById('reg-nome').value.trim();
            let email = document.getElementById('reg-email').value.trim();
            let senha = document.getElementById('reg-senha').value.trim();
            let confirmar = document.getElementById('reg-confirmar').value.trim();

            if (!nome || !email || !senha) { alert("Preencha todos os campos!"); return; }
            if (senha !== confirmar) { alert("As senhas não coincidem!"); return; }

            jogadorAtual.nome = nome;
            jogadorAtual.uid = Math.floor(10000000 + Math.random() * 90000000).toString();
            atualizarInterfaceHub();
            entrarNoJogo();
        }

        function fazerLogin() {
            let email = document.getElementById('login-email').value.trim();
            let senha = document.getElementById('login-senha').value.trim();
            if (!email || !senha) { alert("Preencha e-mail e senha!"); return; }
            entrarNoJogo();
        }

        function entrarNoJogo() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('register-screen').classList.remove('active');
            document.getElementById('main-screen').classList.add('active');
            atualizarInterfaceHub();
        }

        function atualizarInterfaceHub() {
            document.getElementById('hud-nome').innerText = jogadorAtual.nome + " 👑";
            document.getElementById('hud-uid').innerText = jogadorAtual.uid;
            document.getElementById('hud-nivel').innerText = jogadorAtual.nivel;
            document.getElementById('hud-rank').innerText = jogadorAtual.rank;
            document.getElementById('hud-moedas').innerText = jogadorAtual.moedas.toLocaleString();
            document.getElementById('hud-diamantes').innerText = jogadorAtual.diamantes.toLocaleString();
            document.getElementById('hud-pontos').innerText = jogadorAtual.pontos;
            document.getElementById('hud-espada').innerText = jogadorAtual.espada;
            document.getElementById('hud-avatar').src = jogadorAtual.avatar;
        }

        function entrarModoJogar() {
            abrirModal("Modo de Batalha", `<p>Selecione sua fase ou entre em combate contra o Rei Demônio!</p>`);
        }

        function salvarProgressoJogo() { alert("Progresso salvo com sucesso!"); }
        function carregarProgressoJogo() { alert("Progresso carregado!"); }
        function iniciarNovoJogo() {
            if(confirm("Deseja iniciar um novo jogo?")) {
                jogadorAtual.nivel = 1;
                jogadorAtual.pontos = 0;
                atualizarInterfaceHub();
                alert("Novo jogo iniciado!");
            }
        }

        // Sininho de Atualizações
        function abrirAtualizacoes() {
            abrirModal("🔔 Histórico de Atualizações", `
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div style="background: rgba(30,41,59,0.7); padding: 12px; border-radius: 8px;">
                        <h4 style="color: #38bdf8;">Versão 1.2.0 - Atualização do Sistema</h4>
                        <p style="font-size: 13px; color: #cbd5e1; margin-top: 5px;">• Adicionado: Sistema de Chat Global com destaque de ADM.</p>
                        <p style="font-size: 13px; color: #cbd5e1;">• Adicionado: Árvore de Habilidades por níveis.</p>
                        <p style="font-size: 13px; color: #cbd5e1;">• Removido: Bugs de carregamento de perfil na nuvem.</p>
                    </div>
                </div>
            `);
        }

        // Chat Global com identificação e cor apagada/especial para ADM
        function abrirChatGlobal() {
            abrirModal("💬 Chat Global e Comunidade", `
                <div style="display: flex; flex-direction: column; height: 350px; justify-content: space-between;">
                    <div style="flex: 1; overflow-y: auto; background: rgba(11,15,25,0.7); padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Exemplo de Mensagem do ADM -->
                        <div class="chat-msg-adm">
                            <span class="adm-name">Administrador_Master</span><span class="adm-badge">ADM</span>
                            <p style="font-size: 13px; color: #e2e8f0; margin-top: 2px;">Bem-vindos ao Dragon War! Nova atualização disponível no sino.</p>
                        </div>
                        <div>
                            <span style="color: #38bdf8; font-weight: bold; font-size: 13px;">Player_Hero:</span>
                            <p style="font-size: 13px; color: #cbd5e1;">Salve galera! Alguém vai pra guilda?</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" placeholder="Digite sua mensagem..." style="flex: 1; padding: 10px; background: #0b0f19; border: 1px solid #334155; color: #fff; border-radius: 6px;">
                        <button class="btn-auth" style="margin:0; padding: 0 20px;">Enviar</button>
                    </div>
                </div>
            `);
        }

        // Árvore de Habilidades por Níveis
        function abrirArvoreHabilidades() {
            abrirModal("🌳 Árvore de Habilidades", `
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="background: rgba(30,41,59,0.8); padding: 12px; border-radius: 8px; border-left: 4px solid #22c55e;">
                        <h4>Nível 1: Corte Rápido (Desbloqueado)</h4>
                        <p style="font-size: 12px; color: #94a3b8;">Aumenta o dano do ataque básico em 5%.</p>
                    </div>
                    <div style="background: rgba(30,41,59,0.5); padding: 12px; border-radius: 8px; border-left: 4px solid #f59e0b; opacity: 0.7;">
                        <h4>Nível 5: Fúria do Dragão (Bloqueado)</h4>
                        <p style="font-size: 12px; color: #94a3b8;">Requer Nível 5 para desbloqueio automático.</p>
                    </div>
                </div>
            `);
        }

        function abrirConfiguracoesPerfil() {
            abrirModal("⚙️ Configurações de Perfil", `
                <div style="display:flex; flex-direction:column; gap:12px; max-width:400px;">
                    <label>Alterar Nome: <input type="text" id="cfg-nome" value="${jogadorAtual.nome}" style="width:100%; padding:8px; background:#0b0f19; color:#fff; border:1px solid #334155; border-radius:4px;"></label>
                    <label>ID Personalizado (UID): <input type="text" id="cfg-id" value="${jogadorAtual.uid}" style="width:100%; padding:8px; background:#0b0f19; color:#fff; border:1px solid #334155; border-radius:4px;"></label>
                    <button class="btn-auth" onclick="salvarConfigPerfil()">Salvar Alterações</button>
                </div>
            `);
        }

        function salvarConfigPerfil() {
            let novoNome = document.getElementById('cfg-nome').value;
            let novoId = document.getElementById('cfg-id').value;
            if(novoNome) jogadorAtual.nome = novoNome;
            if(novoId) jogadorAtual.uid = novoId;
            atualizarInterfaceHub();
            fecharModal();
            alert("Perfil atualizado com sucesso!");
        }

        function abrirModal(titulo, htmlConteudo) {
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-corpo').innerHTML = htmlConteudo;
            document.getElementById('modal-conteudo').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-conteudo').style.display = 'none';
        }
    </script>
</body>
</html>
