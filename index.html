<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon War - Rise of Power</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: #94a3b8;
      font-weight: bold;
    }
    .tab.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
    }
    button:hover {
      background: #0369a1;
    }
    .btn-action {
      background: #10b981;
      margin-top: 10px;
    }
    .btn-action:hover {
      background: #059669;
    }
    .btn-logout {
      background: #ef4444;
      margin-top: 15px;
    }
    .btn-logout:hover {
      background: #dc2626;
    }
    .hidden {
      display: none;
    }

    /* ESTILOS DA INTERFACE DO JOGO */
    .game-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .stat-box {
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .stat-box strong {
      color: #38bdf8;
    }
    .battle-box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
    }
    .log-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #a7f3d0;
      min-height: 50px;
      max-height: 100px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐉 Dragon War</h1>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen">
      <div class="tabs">
        <div class="tab active" id="tab-login" onclick="showForm('login')">LOGIN</div>
        <div class="tab" id="tab-register" onclick="showForm('register')">CRIAR CONTA</div>
      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit">ENTRAR NO JOGO</button>
      </form>

      <!-- FORMULÁRIO DE REGISTRO -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-username">Nome do Guerreiro</label>
          <input type="text" id="reg-username" required placeholder="Ex: GabrielTheKing">
        </div>
        <div class="form-group">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Senha</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <button type="submit">CRIAR CONTA E JOGAR</button>
      </form>
    </div>

    <!-- TELA DO JOGO (RPG) -->
    <div id="game-screen" class="hidden">
      <h2 style="text-align: center; margin-bottom: 15px;">Mestre: <span id="player-name" style="color: #38bdf8;">---</span></h2>
      
      <div class="game-stats">
        <div class="stat-box"><strong>Nível:</strong> <span id="player-level">1</span></div>
        <div class="stat-box"><strong>Moedas:</strong> 🟡 <span id="player-coins">100</span></div>
        <div class="stat-box"><strong>Vida:</strong> ❤️ <span id="player-hp">100</span>/100</div>
        <div class="stat-box"><strong>Ataque:</strong> ⚔️ <span id="player-atk">15</span></div>
      </div>

      <div class="battle-box">
        <h3 style="color: #f43f5e; margin-bottom: 5px;">Inimigo: <span id="enemy-name">Dragão Filhote</span></h3>
        <p style="margin-bottom: 10px; font-size: 0.9rem;">HP do Inimigo: ❤️ <span id="enemy-hp">50</span>/50</p>
        <button class="btn-action" onclick="attackEnemy()">⚔️ ATACAR</button>
      </div>

      <div class="log-box" id="game-log">
        > Bem-vindo a Dragon War! Clique em Atacar para iniciar a batalha.
      </div>

      <button onclick="handleLogout()" class="btn-logout">SAIR DA CONTA</button>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- LÓGICA DO JOGO E CONEXÃO COM O FIREBASE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgooL-9qYUyUaa7u0BvXg9i9gvXoZMOYc",
      authDomain: "dragon-war-rise-of-power-2a9f1.firebaseapp.com",
      projectId: "dragon-war-rise-of-power-2a9f1",
      storageBucket: "dragon-war-rise-of-power-2a9f1.firebasestorage.app",
      messagingSenderId: "115455691167",
      appId: "1:115455691167:web:ff3638f67b66c17c5515aa",
      measurementId: "G-S7XE2EN9CL"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let playerData = {};
    let enemyHP = 50;

    function showForm(type) {
      document.getElementById('login-form').classList.toggle('hidden', type !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', type === 'login');
      document.getElementById('tab-login').classList.toggle('active', type === 'login');
      document.getElementById('tab-register').classList.toggle('active', type !== 'login');
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        const initialData = {
          username: name,
          email: email,
          level: 1,
          coins: 100,
          hp: 100,
          atk: 15
        };

        await db.collection('users').doc(user.uid).set(initialData);
      } catch (error) {
        alert("Erro no cadastro: " + error.message);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        alert("Erro ao entrar: " + error.message);
      }
    }

    function handleLogout() {
      auth.signOut();
    }

    async function attackEnemy() {
      if (!playerData.username) return;

      const damage = Math.floor(Math.random() * playerData.atk) + 5;
      enemyHP -= damage;

      let log = document.getElementById('game-log');

      if (enemyHP <= 0) {
        playerData.coins += 20;
        playerData.level += 1;
        playerData.atk += 5;
        enemyHP = 50 + (playerData.level * 10);

        log.innerHTML = `> 💥 Você derrotou o inimigo! Ganhou 20 moedas e subiu para o Nível ${playerData.level}!`;

        await db.collection('users').doc(auth.currentUser.uid).update({
          coins: playerData.coins,
          level: playerData.level,
          atk: playerData.atk
        });

        updateUI();
      } else {
        document.getElementById('enemy-hp').innerText = enemyHP;
        log.innerHTML = `> ⚔️ Você causou ${damage} de dano! HP do Inimigo: ${enemyHP}`;
      }
    }

    function updateUI() {
      document.getElementById('player-name').innerText = playerData.username || "Guerreiro";
      document.getElementById('player-level').innerText = playerData.level || 1;
      document.getElementById('player-coins').innerText = playerData.coins || 100;
      document.getElementById('player-hp').innerText = playerData.hp || 100;
      document.getElementById('player-atk').innerText = playerData.atk || 15;
      document.getElementById('enemy-hp').innerText = enemyHP;
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          playerData = doc.data();
          updateUI();
        }
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('game-screen').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
