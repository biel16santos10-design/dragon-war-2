<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon War</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: Arial, sans-serif; 
    background: #0a0e1a; 
    color: #fff; 
    min-height: 100vh;
}
#loading { 
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    background: #0a0e1a; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    z-index: 9999;
}
.spinner { 
    width: 50px; height: 50px; 
    border: 4px solid #333; 
    border-top: 4px solid #ff6b00; 
    border-radius: 50%; 
    animation: spin 1s linear infinite; 
}
@keyframes spin { 
    0% { transform: rotate(0deg); } 
    100% { transform: rotate(360deg); } 
}
.hidden { display: none !important; }
.auth-container { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    padding: 20px; 
}
.auth-card { 
    background: #1e293b; 
    border: 2px solid #ff6b00; 
    border-radius: 15px; 
    padding: 30px; 
    max-width: 400px; 
    width: 100%;
}
.auth-card h1 { 
    text-align: center; 
    color: #ff6b00; 
    margin-bottom: 20px;
}
input { 
    width: 100%; 
    padding: 12px; 
    margin: 10px 0; 
    border-radius: 8px; 
    border: 1px solid #334155; 
    background: #0f172a; 
    color: #fff;
}
button { 
    width: 100%; 
    padding: 12px; 
    margin: 8px 0; 
    border-radius: 8px; 
    border: none; 
    font-weight: bold; 
    cursor: pointer; 
    background: #ff6b00; 
    color: #fff;
}
button:hover { filter: brightness(1.2); }
.game-view { 
    padding: 20px; 
    text-align: center;
}
.player-info { 
    background: #1e293b; 
    padding: 15px; 
    border-radius: 10px; 
    margin-bottom: 20px;
}
.resources { 
    display: flex; 
    gap: 15px; 
    justify-content: center; 
    margin: 20px 0;
}
.resource { 
    background: #1e293b; 
    padding: 10px 20px; 
    border-radius: 8px;
}
.menu-buttons { 
    display: grid; 
    gap: 10px; 
    max-width: 300px; 
    margin: 30px auto;
}
.toast { 
    position: fixed; 
    bottom: 20px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: #1e293b; 
    border: 2px solid #ff6b00; 
    padding: 15px 30px; 
    border-radius: 10px; 
    display: none;
}
</style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
</div>

<div id="authView" class="hidden">
    <div class="auth-container">
        <div class="auth-card">
            <h1> DRAGON WAR</h1>
            <div style="margin: 20px 0;">
                <button onclick="showLogin()">Entrar</button>
                <button onclick="showRegister()" style="background: #22c55e;">Criar Conta</button>
            </div>
            <div id="loginForm">
                <input id="loginEmail" type="email" placeholder="E-mail">
                <input id="loginPass" type="password" placeholder="Senha">
                <button onclick="doLogin()">ENTRAR</button>
            </div>
            <div id="registerForm" class="hidden">
                <input id="regNick" placeholder="Nome do Personagem">
                <input id="regEmail" type="email" placeholder="E-mail">
                <input id="regPass" type="password" placeholder="Senha">
                <button onclick="doRegister()" style="background: #22c55e;">CADASTRAR</button>
            </div>
        </div>
    </div>
</div>

<div id="gameView" class="hidden">
    <div class="game-view">
        <div class="player-info">
            <h2 id="playerName">Carregando...</h2>
            <p>Nível <span id="playerLevel">1</span></p>
        </div>
        
        <div class="resources">
            <div class="resource">💰 <span id="resCoins">0</span></div>
            <div class="resource">💎 <span id="resGems">0</span></div>
            <div class="resource">🔮 <span id="resCrystals">0</span></div>
        </div>

        <div class="menu-buttons">
            <button onclick="showToast('⚔️ Em breve!')">JOGAR</button>
            <button onclick="showToast('🛒 Em breve!')">LOJA</button>
            <button onclick="showToast('✨ Em breve!')">PODERES</button>
            <button onclick="showToast('📊 Em breve!')">RESUMO</button>
            <button onclick="doLogout()" style="background: #ef4444;">SAIR</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDgooL-9qYUyUaa7u0BvXg9i9gvXoZMOYc",
    authDomain: "dragon-war-rise-of-power-2a9f1.firebaseapp.com",
    projectId: "dragon-war-rise-of-power-2a9f1",
    storageBucket: "dragon-war-rise-of-power-2a9f1.firebasestorage.app",
    messagingSenderId: "115455691167",
    appId: "1:115455691167:web:ff3638f67b66c17c5515aa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(db);

let currentUserData = null;
let playerRef = null;

const $ = (id) => document.getElementById(id);

setTimeout(() => { 
    $('loading').classList.add('hidden'); 
}, 1000);

window.showToast = (msg) => {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
};

window.showLogin = () => {
    $('loginForm').classList.remove('hidden');
    $('registerForm').classList.add('hidden');
};

window.showRegister = () => {
    $('loginForm').classList.add('hidden');
    $('registerForm').classList.remove('hidden');
};

window.doLogin = async () => {
    const email = $('loginEmail').value.trim();
    const pass = $('loginPass').value;
    if (!email || !pass) return showToast('Preencha e-mail e senha');
    try {
        await signInWithEmailAndPassword(auth, email, pass);
        showToast('Bem-vindo!');
    } catch(e) {
        showToast('Erro: ' + e.message);
    }
};

window.doRegister = async () => {
    const nick = $('regNick').value.trim();
    const email = $('regEmail').value.trim();
    const pass = $('regPass').value;
    if (!nick || !email || !pass) return showToast('Preencha todos os campos');
    if (pass.length < 6) return showToast('Senha mínima: 6 caracteres');
    try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "players", cred.user.uid), {
            uid: cred.user.uid,
            nick: nick,
            email: email,
            coins: 1000,
            gems: 100,
            crystals: 50,
            level: 1,
            createdAt: serverTimestamp()
        });
        showToast('Conta criada!');
    } catch(e) {
        showToast('Erro: ' + e.message);
    }
};

window.doLogout = () => {
    signOut(auth).then(() => {
        showToast('Desconectado!');
        setTimeout(() => location.reload(), 1000);
    });
};

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        $('loading').classList.add('hidden');
        $('authView').classList.remove('hidden');
        $('gameView').classList.add('hidden');
        return;
    }

    $('authView').classList.add('hidden');
    $('loading').classList.add('hidden');
    $('gameView').classList.remove('hidden');

    playerRef = doc(db, "players", user.uid);
    
    onSnapshot(playerRef, (snap) => {
        if (!snap.exists()) return;
        const data = snap.data();
        currentUserData = data;
        
        $('playerName').textContent = data.nick || 'Jogador';
        $('playerLevel').textContent = data.level || 1;
        $('resCoins').textContent = data.coins || 0;
        $('resGems').textContent = data.gems || 0;
        $('resCrystals').textContent = data.crystals || 0;
    });
});
</script>

</body>
</html>
